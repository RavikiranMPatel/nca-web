server {
    listen 80;
    server_name ncamysuru.com www.ncamysuru.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ncamysuru.com www.ncamysuru.com;

    ssl_certificate     /etc/letsencrypt/live/ncamysuru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncamysuru.com/privkey.pem;

    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }

    location /ws/ {
        proxy_pass http://nca-backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/admin/fees/payments/.*/receipt-pdf$ {
        proxy_pass http://nca-backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://nca-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }

    # Fee receipts are gone from the served tree — FeeReceiptStorageService moves them to
    # app.receipts.dir on boot, and they are read through
    # GET /api/admin/fees/payments/{publicId}/receipt-image behind the admin check.
    # A regex location wins over the /uploads/ prefix below, so if a future code path ever
    # recreates either directory this is a 404 rather than a silent re-leak. The
    # application cannot enforce this for itself; that is the whole reason it is here.
    location ~ ^/uploads/fee-receipts(-pdf)?/ { return 404; }

    location /uploads/ {
        proxy_pass http://nca-backend:8080/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Public marketing assets and player photos only. Nothing under /uploads/ may be
        # payment evidence: this block used to advertise parents' payment screenshots as
        # publicly cacheable for 30 days.
        #
        # Not "immutable": filenames here are 8 hex characters from
        # UUID.randomUUID().toString().substring(0, 8) and are reused across re-uploads,
        # so a 30-day immutable promise can outlive the file it describes.
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}